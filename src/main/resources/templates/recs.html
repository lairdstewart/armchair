<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Armchair</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/logo.svg}" />
    <script th:src="@{/js/cover-fallback.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="page-content">
      <div style="margin-bottom: 15px;">
        <label>
          <input type="radio" name="typeSelector" value="FICTION" checked onchange="showTab('FICTION')" />
          Fiction
        </label>
        <label style="margin-left: 15px;">
          <input type="radio" name="typeSelector" value="NONFICTION" onchange="showTab('NONFICTION')" />
          Non-Fiction
        </label>
      </div>

      <div id="tab-FICTION">
        <div th:if="${fictionRankedCount < minRankedBooks}">
          <p><em th:text="'Rank ' + ${minRankedBooks} + ' Fiction books to get recommendations'"></em></p>
        </div>
        <div th:if="${fictionRankedCount >= minRankedBooks && fictionRecs.isEmpty()}">
          <p><em>No fiction recommendations yet.</em></p>
        </div>
        <div th:if="${fictionRankedCount >= minRankedBooks && !fictionRecs.isEmpty()}">
          <ol class="book-list">
            <li th:each="rb : ${fictionRecs}">
              <span class="book-percent" th:text="${rb.rankDisplay()}"></span>
              <th:block th:replace="~{fragments :: bookEntry(${rb.book()}, ~{:: .fiction-rec-actions}, true, true)}">
                <span class="fiction-rec-actions">
                  <form th:if="${rb.book().workOlid() != null && !userBooks.containsKey(rb.book().workOlid())}" th:action="@{/add-to-reading-list}" method="POST" style="display: inline;">
                    <input type="hidden" name="workOlid" th:value="${rb.book().workOlid()}" />
                    <input type="hidden" name="bookName" th:value="${rb.book().title()}" />
                    <input type="hidden" name="author" th:value="${rb.book().author()}" />
                    <input type="hidden" name="editionOlid" th:value="${rb.book().editionOlid()}" />
                    <input type="hidden" name="returnUrl" value="/recs" />
                    <button type="submit" class="book-action-link">want to read</button>
                  </form>
                  <a th:if="${rb.book().workOlid() != null && userBooks.containsKey(rb.book().workOlid())}"
                     th:href="@{/my-books(selectedBookshelf=${userBooks.get(rb.book().workOlid()).bookshelf()})}"
                     class="book-action-link">view in library</a>
                </span>
              </th:block>
            </li>
          </ol>
        </div>
      </div>

      <div id="tab-NONFICTION" style="display: none;">
        <div th:if="${nonfictionRankedCount < minRankedBooks}">
          <p><em th:text="'Rank ' + ${minRankedBooks} + ' Non-Fiction books to get recommendations'"></em></p>
        </div>
        <div th:if="${nonfictionRankedCount >= minRankedBooks && nonfictionRecs.isEmpty()}">
          <p><em>No nonfiction recommendations yet.</em></p>
        </div>
        <div th:if="${nonfictionRankedCount >= minRankedBooks && !nonfictionRecs.isEmpty()}">
          <ol class="book-list">
            <li th:each="rb : ${nonfictionRecs}">
              <span class="book-percent" th:text="${rb.rankDisplay()}"></span>
              <th:block th:replace="~{fragments :: bookEntry(${rb.book()}, ~{:: .nonfiction-rec-actions}, true, true)}">
                <span class="nonfiction-rec-actions">
                  <form th:if="${rb.book().workOlid() != null && !userBooks.containsKey(rb.book().workOlid())}" th:action="@{/add-to-reading-list}" method="POST" style="display: inline;">
                    <input type="hidden" name="workOlid" th:value="${rb.book().workOlid()}" />
                    <input type="hidden" name="bookName" th:value="${rb.book().title()}" />
                    <input type="hidden" name="author" th:value="${rb.book().author()}" />
                    <input type="hidden" name="editionOlid" th:value="${rb.book().editionOlid()}" />
                    <input type="hidden" name="returnUrl" value="/recs?tab=NONFICTION" />
                    <button type="submit" class="book-action-link">want to read</button>
                  </form>
                  <a th:if="${rb.book().workOlid() != null && userBooks.containsKey(rb.book().workOlid())}"
                     th:href="@{/my-books(selectedBookshelf=${userBooks.get(rb.book().workOlid()).bookshelf()})}"
                     class="book-action-link">view in library</a>
                </span>
              </th:block>
            </li>
          </ol>
        </div>
      </div>
    </div>

    <script>
    function showTab(type) {
      document.querySelectorAll('[id^="tab-"]').forEach(function(el) { el.style.display = 'none'; });
      var tab = document.getElementById('tab-' + type);
      if (tab) tab.style.display = '';
      document.querySelector('input[name="typeSelector"][value="' + type + '"]').checked = true;
      var url = new URL(window.location);
      url.searchParams.set('tab', type);
      history.replaceState(null, '', url);
    }
    var params = new URLSearchParams(window.location.search);
    var tab = params.get('tab');
    if (tab) showTab(tab);
    </script>
    <script th:src="@{/js/review-toggle.js}"></script>
  </body>
</html>
